# Production Environment Configuration
# Optimized for high-performance production deployment

# Security Configuration
master_key: "PRODUCTION_MASTER_KEY_CHANGE_THIS"
jwt_secret: "PRODUCTION_JWT_SECRET_CHANGE_THIS"
bootstrap_token: "PRODUCTION_BOOTSTRAP_TOKEN_CHANGE_THIS"

# Environment configuration affects database pool settings
environment: "production"

# Database Configuration
database:
  # PostgreSQL connection for production (recommended)
  connection: "postgres://password_manager:secure_password@localhost:5432/password_manager_prod?sslmode=require&application_name=password-manager"
  driver: "postgres"
  # Connection pool settings (automatically configured for production)
  # Production defaults:
  # - max_open_conns: 50
  # - max_idle_conns: 10
  # - conn_max_lifetime: 30m
  # - conn_max_idle_time: 5m

# Logging Configuration
log:
  level: "info"
  file: "/var/log/password-manager/production.log"
  format: "json"
  pretty_print: false
  max_backups: 10
  max_age_days: 30
  max_size_mb: 100
  rotation_method: "hybrid"

# Server Configuration
server:
  listen_addr: ":8443"
  read_timeout: "15s"
  write_timeout: "15s"
  idle_timeout: "60s"

# Performance Monitoring
monitoring:
  enable_metrics: true
  metrics_interval: "30s"
  slow_query_threshold: "100ms"

# Health Check Configuration
health:
  check_interval: "30s"
  database_timeout: "5s"
  enable_detailed_metrics: true

# Production-specific features
production:
  enable_tls: true
  strict_security: true
  detailed_audit_logging: true
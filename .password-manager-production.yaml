# Production Database Configuration Example
# This file demonstrates optimized database settings for production deployment

master_key: "PRODUCTION_MASTER_KEY_CHANGE_THIS"
jwt_secret: "PRODUCTION_JWT_SECRET_CHANGE_THIS"
bootstrap_token: "PRODUCTION_BOOTSTRAP_TOKEN_CHANGE_THIS"

# Environment configuration affects connection pool settings
environment: "prod"

database:
  # PostgreSQL connection for production (recommended)
  connection: "postgres://password_manager:secure_password@localhost:5432/password_manager_prod?sslmode=require&application_name=password-manager"
  driver: "postgres"

  # Connection pool settings (automatically configured based on environment)
  # Production defaults:
  # - max_open_conns: 50
  # - max_idle_conns: 10
  # - conn_max_lifetime: 30m
  # - conn_max_idle_time: 5m

# Logging configuration
log:
  level: "info"
  file: "/var/log/password-manager/production.log"

# Server configuration
server:
  listen_addr: ":8443"
  read_timeout: "15s"
  write_timeout: "15s"
  idle_timeout: "60s"

# Performance monitoring
monitoring:
  enable_metrics: true
  metrics_interval: "30s"
  slow_query_threshold: "100ms"

# Health check configuration
health:
  check_interval: "30s"
  database_timeout: "5s"
  enable_detailed_metrics: true
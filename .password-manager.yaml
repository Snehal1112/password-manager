# Development Environment Configuration
# Optimized for local development and testing

# Security Configuration
master_key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
jwt_secret: "test-jwt-secret-for-development"
bootstrap_token: "test-bootstrap-token-12345"

# Environment configuration affects database pool settings
environment: "development"

# Database Configuration
database:
  connection: "./dev-password-manager.db"
  driver: "sqlite3"
  # Connection pool settings (automatically configured for development)
  # Development defaults:
  # - max_open_conns: 10
  # - max_idle_conns: 2
  # - conn_max_lifetime: 10m
  # - conn_max_idle_time: 2m

# Logging Configuration
log:
  level: "debug"
  file: "./logs/development.log"
  format: "text"
  pretty_print: true
  max_backups: 3
  max_age_days: 7
  max_size_mb: 10
  rotation_method: "size"

# Server Configuration
server:
  listen_addr: ":8080"
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "120s"

# Performance Monitoring
monitoring:
  enable_metrics: true
  metrics_interval: "60s"
  slow_query_threshold: "500ms"

# Health Check Configuration
health:
  check_interval: "60s"
  database_timeout: "10s"
  enable_detailed_metrics: true

# Development-specific features
development:
  enable_debug_endpoints: true
  detailed_error_responses: true
  cors_enabled: true

# Retry Logic Configuration
retry:
  database:
    enabled: true
    max_attempts: 2
    initial_delay: "50ms"
    max_delay: "1s"
    backoff_multiplier: 2.0
    retryable_errors:
      - "connection refused"
      - "database is locked"
      - "busy"
      - "timeout"
    jitter_enabled: true

  external_services:
    enabled: true
    max_attempts: 3
    initial_delay: "100ms"
    max_delay: "5s"
    backoff_multiplier: 2.0
    retryable_errors:
      - "connection refused"
      - "no such host"
      - "timeout"
      - "temporary failure"
      - "service unavailable"
      - "too many requests"
    jitter_enabled: true

  service_operations:
    enabled: true
    max_attempts: 2
    initial_delay: "100ms"
    max_delay: "1s"
    backoff_multiplier: 1.5
    retryable_errors:
      - "connection refused"
      - "timeout"
      - "temporary failure"
    jitter_enabled: true

  circuit_breaker:
    failure_threshold: 3
    timeout: "30s"
    half_open_requests: 2
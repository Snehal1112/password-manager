version: "2"

linters:
  enable:
    - errcheck       # unhandled errors
    - govet          # vet checks (shadow, printf, etc.)
    - ineffassign    # unused assignments
    - staticcheck    # broad static analysis
    - unused         # unused code
    - gosec          # security issues
    - misspell       # common spelling mistakes
    - noctx          # http requests without context
    - bodyclose      # unclosed http response bodies
    - errorlint      # errors.Is/As usage
    - exhaustive     # exhaustive switch/map for enums

formatters:
  enable:
    - gofmt          # formatting
    - goimports      # import ordering

linters-settings:
  gosec:
    excludes:
      - G115   # integer overflow (too noisy for this codebase)
  exhaustive:
    default-signifies-exhaustive: true

issues:
  exclude-rules:
    # Test files get more latitude.
    - path: "_test\\.go"
      linters:
        - gosec
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0

# Prometheus scrape configuration for RocketVault.
#
# Used by the optional "prometheus" service in docker-compose.yml, which is
# gated behind the "metrics" profile:
#
#   docker compose --profile metrics up --build
#
# Targets are resolved on the rocketvault_net bridge network, so "rocketvault"
# is the compose service name and 8774 is the container-internal port, not the
# published host port. To run Prometheus outside compose against a local
# server, replace the target with host.docker.internal:8774 (Docker Desktop) or
# localhost:8774 (Prometheus installed directly on the host).

global:
  # RocketVault refreshes its rocketvault_db_* gauges on the
  # monitoring.metrics_interval ticker, 60s by default. Scraping faster than
  # that re-reads the same values, so keep this at or above that interval
  # unless you also lower metrics_interval in .rocketvault.yaml.
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: rocketvault
    # The path is unversioned and deliberately outside /api/v1 -- it is
    # registered on the root router so it bypasses the auth middleware chain.
    metrics_path: /metrics
    static_configs:
      - targets: ["numericlabs.lxd:8774"]
        labels:
          service: rocketvault

  # Rocket-mem's Prometheus endpoint (rocket-mem/crates/server/src/metrics.rs)
  # binds only to 127.0.0.1:9121 on its host -- unreachable from this
  # container directly, even via host-gateway, since a loopback bind never
  # accepts connections from outside that host. Caddyfile.local's /metrics*
  # route is the only thing that does reach it, reverse-proxying to
  # 127.0.0.1:9121 from the same host Rocket-mem runs on. So this job goes
  # through Caddy's TLS listener instead of a direct static_config target.
  #
  # numericlabs.lxd must resolve from inside this container -- add once,
  # matching this compose file's own host machine:
  #   extra_hosts:
  #     - "numericlabs.lxd:host-gateway"
  # (host-gateway resolves to the host's real, non-loopback address, which
  # is what Caddy is actually listening on.)
  #
  # The TLS cert is a local self-signed one (see Caddyfile.local) -- there is
  # no CA to verify it against from inside the container, so this is the one
  # scrape job in this file that skips verification. Local-network-only by
  # design; never point insecure_skip_verify at a real deployment.
  - job_name: rocket-mem
    scheme: https
    tls_config:
      insecure_skip_verify: true
    metrics_path: /metrics
    static_configs:
      - targets: ["numericlabs.lxd:443"]
        labels:
          service: rocket-mem

  # Prometheus scraping itself. Useful for confirming the stack is alive when
  # the RocketVault target is down.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

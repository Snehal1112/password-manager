# Staging Environment Configuration
# Pre-production environment for testing production-like settings

# Security Configuration
master_key: "STAGING_MASTER_KEY_CHANGE_THIS"
jwt_secret: "STAGING_JWT_SECRET_CHANGE_THIS"
bootstrap_token: "STAGING_BOOTSTRAP_TOKEN_CHANGE_THIS"

# Environment configuration affects database pool settings
environment: "staging"

# Database Configuration
database:
  # PostgreSQL connection for staging (recommended for production-like testing)
  connection: "postgres://password_manager_staging:staging_password@localhost:5432/password_manager_staging?sslmode=require&application_name=password-manager-staging"
  driver: "postgres"
  # Connection pool settings (automatically configured for staging)
  # Staging defaults:
  # - max_open_conns: 20
  # - max_idle_conns: 5
  # - conn_max_lifetime: 20m
  # - conn_max_idle_time: 3m

# Logging Configuration
log:
  level: "info"
  file: "/var/log/password-manager/staging.log"
  format: "json"
  pretty_print: true
  max_backups: 5
  max_age_days: 14
  max_size_mb: 50
  rotation_method: "hybrid"

# Server Configuration
server:
  listen_addr: ":8444"
  read_timeout: "20s"
  write_timeout: "20s"
  idle_timeout: "90s"

# Performance Monitoring
monitoring:
  enable_metrics: true
  metrics_interval: "30s"
  slow_query_threshold: "150ms"

# Health Check Configuration
health:
  check_interval: "30s"
  database_timeout: "5s"
  enable_detailed_metrics: true

# Staging-specific features
staging:
  enable_debug_headers: true
  detailed_performance_logs: true
  test_data_allowed: true
# Legacy Test Configuration (maintained for backward compatibility)
# Use .password-manager-test.yaml for new deployments

# Security Configuration
master_key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
jwt_secret: "test-jwt-secret-for-testing"
bootstrap_token: "test-bootstrap-token-12345"

# Environment configuration affects database pool settings
environment: "test"

# Database Configuration
database:
  connection: "./test-secrets.db"
  driver: "sqlite3"
  # Connection pool settings (automatically configured for testing)
  # Test defaults:
  # - max_open_conns: 5
  # - max_idle_conns: 1
  # - conn_max_lifetime: 5m
  # - conn_max_idle_time: 1m

# Logging Configuration
log:
  level: "debug"
  file: "./test-secrets.log"
  format: "text"
  pretty_print: true
  max_backups: 2
  max_age_days: 3
  max_size_mb: 5
  rotation_method: "size"

# Server Configuration
server:
  listen_addr: ":8082"
  read_timeout: "15s"
  write_timeout: "15s"
  idle_timeout: "60s"

# Performance Monitoring
monitoring:
  enable_metrics: true
  metrics_interval: "30s"
  slow_query_threshold: "200ms"

# Health Check Configuration
health:
  check_interval: "30s"
  database_timeout: "5s"
  enable_detailed_metrics: true

# Test-specific features
test:
  enable_test_endpoints: true
  fast_mode: true
  cleanup_on_exit: true

# Retry Logic Configuration (optimized for testing)
retry:
  database:
    enabled: true
    max_attempts: 2
    initial_delay: "1ms"
    max_delay: "10ms"
    backoff_multiplier: 2.0
    retryable_errors:
      - "connection refused"
      - "database is locked"
      - "busy"
      - "timeout"
    jitter_enabled: false

  external_services:
    enabled: true
    max_attempts: 2
    initial_delay: "1ms"
    max_delay: "10ms"
    backoff_multiplier: 2.0
    retryable_errors:
      - "connection refused"
      - "no such host"
      - "timeout"
      - "temporary failure"
      - "service unavailable"
      - "too many requests"
    jitter_enabled: false

  service_operations:
    enabled: true
    max_attempts: 2
    initial_delay: "1ms"
    max_delay: "10ms"
    backoff_multiplier: 1.5
    retryable_errors:
      - "connection refused"
      - "timeout"
      - "temporary failure"
    jitter_enabled: false

  circuit_breaker:
    failure_threshold: 2
    timeout: "100ms"
    half_open_requests: 1
# Legacy Test Configuration (maintained for backward compatibility)
# Use .password-manager-test.yaml for new deployments

# Security Configuration
master_key: "***SECRET-REMOVED-2026-08-17***"
jwt_secret: "test-jwt-secret-for-testing"
bootstrap_token: "test-bootstrap-token-12345"

# Environment configuration affects database pool settings
environment: "test"

# Database Configuration
database:
  connection: "./test-secrets.db"
  driver: "sqlite3"
  # Connection pool settings (automatically configured for testing)
  # Test defaults:
  # - max_open_conns: 5
  # - max_idle_conns: 1
  # - conn_max_lifetime: 5m
  # - conn_max_idle_time: 1m

# Logging Configuration
log:
  level: "debug"
  file: "./test-secrets.log"
  format: "text"
  pretty_print: true
  max_backups: 2
  max_age_days: 3
  max_size_mb: 5
  rotation_method: "size"

# Server Configuration
server:
  listen_addr: ":8082"
  read_timeout: "15s"
  write_timeout: "15s"
  idle_timeout: "60s"

# Performance Monitoring
monitoring:
  enable_metrics: true
  metrics_interval: "30s"
  slow_query_threshold: "200ms"

# Health Check Configuration
health:
  check_interval: "30s"
  database_timeout: "5s"
  enable_detailed_metrics: true

# Test-specific features
test:
  enable_test_endpoints: true
  fast_mode: true
  cleanup_on_exit: true
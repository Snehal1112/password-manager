name: Go

on:
  push:
    branches: ["v-4.0.0", "main"]
  pull_request:
    branches: ["v-4.0.0", "main"]

jobs:

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: No owner scope on the data plane
        run: |
          # P2 (Task 11) retired ScopeOwner from the crypto handlers, key
          # delete, and key rotate: every vault-scoped route now builds a
          # model.ScopeVault, gated by vault role membership instead of key
          # ownership. This gate keeps that retirement from silently
          # regressing on those call sites.
          #
          # Exclusions, beyond model/scope.go (defines the constructor itself):
          #   - _test.go              unit tests legitimately hand-build
          #                           ScopeOwner to exercise code paths that
          #                           still accept it (the repository
          #                           predicate, legacy flat routes, cmd/
          #                           tools). This gate is about the data
          #                           plane's production call sites, not
          #                           fixtures -- model/scope_test.go and
          #                           internal/repositories/scope_predicate_test.go
          #                           are covered by this same exclusion.
          #   - cmd/                  CLI direct-owner tools; a documented,
          #                           separately-tracked deferral (see
          #                           .claude/multi-vault.md).
          #   - secrets/versioning_service.go, secrets/rotation_service.go
          #                           secret rollback keys off the owner
          #                           deliberately; a different subsystem,
          #                           out of P2 scope.
          #   - certificates/certificate_service.go
          #                           certificate auto-renewal; a different
          #                           subsystem, out of P2 scope.
          #   - api/context.go        scopeFromRequest itself: legacy flat
          #                           routes (no vault_name segment) still
          #                           yield an owner scope by design, per its
          #                           own doc comment -- collapsing that onto
          #                           vault scope is future work, not P2.
          #   - api/certificates.go   updateCertificate is not yet vault-scope
          #                           aware; a documented deferral (see
          #                           .claude/multi-vault.md).
          #   - the createKey post-create read-back in api/keys.go (currently
          #     line 358): it reads back the resource the caller just
          #     created, by the caller's own id, so it is excluded by content
          #     rather than by file -- api/keys.go's other eight call sites
          #     (the six crypto operations, delete, rotate) stay under this
          #     gate. The exclusion pattern includes the full argument list
          #     ("model.NewOwnerScope(vaultID, userID))"), not just the
          #     "keyService.GetKey(...result.KeyID, model.NewOwnerScope"
          #     prefix: rotateKey's read-back (api/keys.go:567) also calls
          #     keyService.GetKey(r.Context(), result.KeyID, ...) -- same
          #     receiver, same second argument -- so a prefix-only pattern
          #     would silently exempt a regression there too if rotateKey's
          #     `scope` variable were ever mutated back to a hardcoded
          #     NewOwnerScope call. rotateKey has no local `vaultID`/`userID`
          #     variables in that scope (it uses `scope` from
          #     scopeFromRequest), so the full argument list keeps this
          #     exclusion specific to createKey's line alone.
          if grep -rn "NewOwnerScope\|ownerScopeFromRequest" --include="*.go" . \
               | grep -v "_test.go" \
               | grep -v "model/scope.go" \
               | grep -v "cmd/" \
               | grep -v "internal/services/secrets/versioning_service.go" \
               | grep -v "internal/services/secrets/rotation_service.go" \
               | grep -v "internal/services/certificates/certificate_service.go" \
               | grep -v "api/context.go" \
               | grep -v "api/certificates.go" \
               | grep -v "keyService.GetKey(r.Context(), result.KeyID, model.NewOwnerScope(vaultID, userID))"; then
            echo "owner scope reached the data plane; P2 retired it" >&2
            exit 1
          fi

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  scope-gate:
    name: Scope API Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No legacy InVault/ByOwner methods
        run: |
          # internal/services/secrets/rotation_service.go and
          # internal/repositories/rotation_repository.go are excepted: the
          # rotation subsystem intentionally still keys off user_id via
          # ListByUser. This is a permanent, documented deferral (secondary
          # subsystems are out of scope for the P1 scope refactor per the
          # plan's own corrections section), not a legacy pattern to migrate.
          if grep -rn "InVault\|ReadByOwner\|ListByUser(" --include="*.go" . | grep -v "_test.go" | grep -v "^./internal/services/secrets/rotation_service.go" | grep -v "^./internal/repositories/rotation_repository.go"; then
            echo "::error::legacy vault-scoping methods reintroduced; use model.Scope"
            exit 1
          fi

      - name: No transitional Scoped suffix
        run: |
          if grep -rnE "(Read|Update|List)Scoped|(Get|List|Update|Delete)(Secret|Secrets|Key|Keys|Certificate|Certificates)Scoped|(Recover|Purge)SecretScoped|Get(Version|Versions|LatestVersion)Scoped" --include="*.go" .; then
            echo "::error::transitional Scoped suffix survived the Phase 6 rename"
            exit 1
          fi

      - name: No hand-built Scope literals
        run: |
          if grep -rn "model\.Scope{" --include="*.go" . | grep -v "^./api/context.go"; then
            echo "::error::construct scopes with NewVaultScope/NewOwnerScope/NewAdminScope"
            exit 1
          fi

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ""   # reads from go.mod
          go-package: ./...

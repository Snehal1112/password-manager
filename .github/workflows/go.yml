name: Go

on:
  push:
    branches: ["v-4.0.0", "main"]
  pull_request:
    branches: ["v-4.0.0", "main"]

jobs:

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  scope-gate:
    name: Scope API Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No legacy InVault/ByOwner methods
        run: |
          # internal/services/secrets/rotation_service.go and
          # internal/repositories/rotation_repository.go are excepted: the
          # rotation subsystem intentionally still keys off user_id via
          # ListByUser. This is a permanent, documented deferral (secondary
          # subsystems are out of scope for the P1 scope refactor per the
          # plan's own corrections section), not a legacy pattern to migrate.
          if grep -rn "InVault\|ReadByOwner\|ListByUser(" --include="*.go" . | grep -v "_test.go" | grep -v "^./internal/services/secrets/rotation_service.go" | grep -v "^./internal/repositories/rotation_repository.go"; then
            echo "::error::legacy vault-scoping methods reintroduced; use model.Scope"
            exit 1
          fi

      - name: No transitional Scoped suffix
        run: |
          if grep -rnE "(Read|Update|List)Scoped|(Get|List|Update|Delete)(Secret|Secrets|Key|Keys|Certificate|Certificates)Scoped|(Recover|Purge)SecretScoped|Get(Version|Versions|LatestVersion)Scoped" --include="*.go" .; then
            echo "::error::transitional Scoped suffix survived the Phase 6 rename"
            exit 1
          fi

      - name: No hand-built Scope literals
        run: |
          if grep -rn "model\.Scope{" --include="*.go" . | grep -v "^./api/context.go"; then
            echo "::error::construct scopes with NewVaultScope/NewOwnerScope/NewAdminScope"
            exit 1
          fi

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ""   # reads from go.mod
          go-package: ./...
